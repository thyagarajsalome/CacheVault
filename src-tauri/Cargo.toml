[package]
name = "app"
version = "1.0.0"
description = "CacheVault Pro - Windows Storage Suite"
authors = ["Thyagaraja"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "CacheVault"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
sysinfo = "0.33"
